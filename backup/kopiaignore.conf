{#-
  Contents of the .kopiaignore file placed at the top of a database's directory under /srv/storage.

  Takes "elasticsearch" in the context. What is left out follows backup:lvm: with a filesystem snapshot the data directory is read consistently and is backed
  up as it is, and without one it cannot be copied while the server is writing to it and is left out. An Elasticsearch directory additionally leaves out the
  snapshot repository the container writes into, which holds another copy of what is in the index.
-#}
{%- set backup_lvm = salt['pillar.get']('backup:lvm', {}) -%}
# ------------------------------------------------------------------------
# THIS FILE HAS BEEN AUTOMATICALLY GENERATED VIA SALT-BASED CONFIGURATION.
# ANY MANUAL CHANGES WILL BE OVERWRITTEN!
# ------------------------------------------------------------------------
{%- if not backup_lvm %}
data
{%- endif %}
{%- if elasticsearch %}
snapshots
{%- endif %}
